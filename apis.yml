aid: evolution-mining

name: Evolution Mining

description: 'Evolution Mining Ltd (ASX: EVN) is an Australian-headquartered gold miner that describes itself as a leading,
  globally relevant gold company operating mines in Australia and Canada, including Cowal, Ernest Henry, Mt Rawdon, Mungari,
  Northparkes and Red Lake. Its website (evolutionmining.com; evolutionmining.com.au redirects there) publishes an investor
  centre with ASX announcements, reports and an Interactive Analyst Centre, plus sustainability disclosures, news and careers.
  No public developer API, documentation or developer portal was found on its site. It was surfaced via the API Evangelist
  harvest backlog (source: australia-apidays-2026).'

